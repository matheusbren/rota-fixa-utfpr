<div class="drawer bg-base-200 text-base-content lg:drawer-open">
  <input
    #drawerToggle
    id="app-drawer"
    type="checkbox"
    class="drawer-toggle"
    tabindex="-1"
    aria-hidden="true"
    [checked]="drawerOpen()"
    (change)="drawerOpen.set(drawerToggle.checked)"
  />
  <div class="drawer-content flex min-h-dvh flex-col">
    <app-top-bar (menuOpen)="openDrawer()" />
    <main class="flex-1 px-4 py-6">
      <router-outlet />
    </main>
    <app-footer />
  </div>
  <div class="drawer-side">
    <label for="app-drawer" aria-label="Fechar menu" class="drawer-overlay"></label>
    <app-side-nav [links]="navLinks" (linkSelect)="closeDrawer()" />
  </div>
</div>
